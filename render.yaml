# Free test backend for a separate Vercel frontend.
# SQLite and uploads under /app/storage are ephemeral without a paid disk.
services:
  - type: web
    name: document-retriever-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:////app/storage/mccia.db
      - key: STORAGE_PATH
        value: /app/storage
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_SEED
        value: "false"
      - key: ALLOW_REGISTRATION
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: CORS_ORIGINS
        sync: false
