# One service hosts both frontend and backend. Persistent disks require a paid plan.
services:
  - type: web
    name: document-retriever
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile.fullstack
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: document-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        value: sqlite:////var/data/mccia.db
      - key: STORAGE_PATH
        value: /var/data/storage
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_SEED
        value: "false"
      - key: ALLOW_REGISTRATION
        value: "true"
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
